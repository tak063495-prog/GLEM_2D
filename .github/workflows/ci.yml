name: GLEM-CI

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GLEM.sln

      - name: Build
        run: dotnet build GLEM.sln -c Release --no-restore

      - name: Test (with coverage)
        env:
          GLEM_RECORD_PERF: '1'
          GLEM_PERF_OUTPUT: '${{ runner.temp }}\glem-perf\perf-log.jsonl'
        run: >
          dotnet test tests/GLEM.Tests/GLEM.Tests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage"

      - name: Coverage gate (GLEM.Core >= 80%)
        shell: pwsh
        run: |
          $xml = Get-ChildItem -Path . -Recurse -Include *.cobertura.xml,*.coveragexml -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $xml) { throw "coverage file not found" }
          & powershell -NoProfile -File scripts/coverage-gate.ps1 -CoverageXmlPath $xml.FullName

      - name: Upload performance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glem-performance-${{ github.run_id }}
          path: '${{ runner.temp }}\glem-perf\perf-log.jsonl'
          if-no-files-found: warn
          retention-days: 30
