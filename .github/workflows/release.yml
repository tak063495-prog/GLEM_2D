name: GLEM-Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create Windows x64 package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package-release.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub Release and upload zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          $assets = Get-ChildItem -LiteralPath artifacts/release -Filter *.zip | Select-Object -ExpandProperty FullName
          gh release create $version $assets --repo "${{ github.repository }}" --title "GLEM $version" --generate-notes
